name: build-binaries

on:
  push:
    branches:
      - chore/go-backend-vite-web
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: go-backend/web/public
          if-no-files-found: error

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: go-backend/web/public

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum

      - name: Build
        working-directory: go-backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o "dist/ws-scrcpy-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/ws-scrcpy-server

      - name: Package
        working-directory: go-backend
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          dir="dist/ws-scrcpy-$GOOS-$GOARCH"
          mkdir -p "$dir"
          cp "dist/ws-scrcpy-$GOOS-$GOARCH$EXT" "$dir/"
          cp ../vendor/Genymobile/scrcpy/scrcpy-server.jar "$dir/"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -r "ws-scrcpy-$GOOS-$GOARCH.zip" "ws-scrcpy-$GOOS-$GOARCH")
          else
            tar -C dist -czf "dist/ws-scrcpy-$GOOS-$GOARCH.tar.gz" "ws-scrcpy-$GOOS-$GOARCH"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ws-scrcpy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            go-backend/dist/*.tar.gz
            go-backend/dist/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts/
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ws-scrcpy $GITHUB_REF_NAME" \
            --generate-notes
